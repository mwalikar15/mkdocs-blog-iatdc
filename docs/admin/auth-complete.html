<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Authenticating...</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .box {
      text-align: center;
      padding: 2rem 3rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; color: #555; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <p id="msg">Completing authentication...</p>
  </div>

  <script>
    (function () {
      var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      var PROXY = isLocal ? 'http://localhost:8081' : window.location.origin + '/oauth';
      var msgEl = document.getElementById('msg');
      var spinner = document.getElementById('spinner');

      function showError(text) {
        spinner.style.display = 'none';
        msgEl.textContent = '❌ ' + text;
        msgEl.style.color = '#c00';
      }

      // Step 1: Get the OAuth code GitHub sent us
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');

      if (error) {
        showError('GitHub denied access: ' + error);
        return;
      }

      if (!code) {
        showError('No authorization code received from GitHub.');
        return;
      }

      // Step 2: Exchange code for token via our local proxy
      msgEl.textContent = 'Exchanging token...';

      fetch(PROXY + '/token?code=' + encodeURIComponent(code))
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.error) {
            showError('Token error: ' + data.error);
            return;
          }

          // Step 3: Send token to Decap CMS via postMessage
          // Works because this page is at localhost:8000 — SAME origin as the CMS
          var message = 'authorization:github:success:' + JSON.stringify({
            token: data.token,
            provider: 'github'
          });

              // ── Send token via BroadcastChannel and WAIT for ack ────────
          // We must NOT close the popup until the CMS window confirms it
          // forwarded the token to Decap CMS — otherwise Decap CMS removes
          // its message listener the moment popup.closed becomes true.
          msgEl.textContent = '\u2705 Authenticated! Returning to CMS...';
          spinner.style.display = 'none';

          try {
            // Listen for ack BEFORE sending token (avoid race condition)
            var ackChannel = new BroadcastChannel('decap_cms_auth_ack');
            ackChannel.onmessage = function () {
              ackChannel.close();
              console.log('[auth-complete] Ack received — closing popup');
              window.close();
            };
            // Safety fallback: close after 8 seconds regardless
            setTimeout(function () { ackChannel.close(); window.close(); }, 8000);

            // Now send the token
            var bc = new BroadcastChannel('decap_cms_auth');
            bc.postMessage({ token: data.token, provider: 'github' });
            bc.close();
            console.log('[auth-complete] Token sent via BroadcastChannel \u2705 (waiting for ack...)');

          } catch (e) {
            // BroadcastChannel not available — fallback to localStorage + close
            localStorage.setItem('decap-cms-auth', JSON.stringify({
              token: data.token, provider: 'github', ts: Date.now()
            }));
            setTimeout(function () { window.close(); }, 3000);
          }
        })
        .catch(function (err) {
          showError('Could not reach OAuth proxy. Is it running on port 8081?');
          console.error(err);
        });
    })();
  </script>
</body>
</html>
