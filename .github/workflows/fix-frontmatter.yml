name: Fix CMS Frontmatter

# Triggered when Decap CMS pushes new or edited posts
on:
  push:
    branches: [main, master]
    paths:
      - "docs/posts/**"

jobs:
  normalize:
    runs-on: ubuntu-latest
    # Prevent recursive trigger when this workflow itself pushes
    if: "!contains(github.event.head_commit.message, 'ci: normalize CMS frontmatter')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token with write access so the commit can be pushed back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PyYAML

      - name: Normalize frontmatter
        run: python .github/scripts/normalize_frontmatter.py

      - name: Commit normalized files (if any changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/posts/
          git diff --cached --quiet || git commit -m "ci: normalize CMS frontmatter"
          git push
